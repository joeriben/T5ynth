<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <style>
      .bg     { fill: #0e1018; }
      .card   { fill: #1a1e2a; stroke: #353a4a; }
      .surf   { fill: #1e2130; }
      .btn    { fill: #1e2130; stroke: #353a4a; }
      .on     { fill: #e91e63; }
      .txt    { fill: #e7edf5; }
      .dim    { fill: #c2cad7; }
      .muted  { fill: #9aa6b8; }
      .osc    { fill: #667eea; }
      .hdr    { fill: #b5225a; }
      .slot   { fill: none; stroke: #353a4a; stroke-dasharray: 4 3; }
      .note   { fill: #768294; }
      .rule   { stroke: #353a4a; }
      .callout{ fill: #141722; stroke: #353a4a; }
      .code   { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="1010" class="bg"/>

  <!-- ══════════════ A: no orchestra yet ══════════════ -->
  <text x="30" y="28" class="muted" font-size="13" font-weight="600">A — bevor der Autor geschrieben hat (Zustand von heute, unverändert)</text>

  <rect x="30" y="40" width="1140" height="200" class="card" rx="3"/>
  <rect x="30" y="40" width="1140" height="22" class="hdr" rx="3"/>
  <text x="42" y="56" class="txt" font-size="12" font-weight="700" letter-spacing="0.6">ENGINE</text>

  <!-- top bar -->
  <rect x="42" y="72" width="150" height="24" class="slot" rx="2"/>
  <text x="117" y="88" class="note" font-size="9" text-anchor="middle">(Platz der Engine-Schalter)</text>

  <g>
    <rect x="204" y="72" width="200" height="24" class="btn" rx="2"/>
    <rect x="288" y="73" width="28" height="22" class="on"/>
    <text x="217" y="88" class="dim" font-size="10">Mono</text>
    <text x="253" y="88" class="dim" font-size="10">4</text>
    <text x="273" y="88" class="dim" font-size="10">8</text>
    <text x="299" y="88" class="txt" font-size="10">16</text>
    <text x="330" y="88" class="dim" font-size="10">32</text>
    <text x="368" y="88" class="dim" font-size="10">64</text>
  </g>
  <rect x="418" y="72" width="70" height="24" class="btn" rx="2"/>
  <text x="453" y="88" class="dim" font-size="10" text-anchor="middle">12–TET</text>

  <g>
    <rect x="700" y="72" width="130" height="24" class="btn" rx="2"/>
    <rect x="751" y="73" width="26" height="22" class="on"/>
    <text x="711" y="88" class="dim" font-size="10">−2</text>
    <text x="737" y="88" class="dim" font-size="10">−1</text>
    <text x="761" y="88" class="txt" font-size="10">0</text>
    <text x="785" y="88" class="dim" font-size="10">+1</text>
    <text x="810" y="88" class="dim" font-size="10">+2</text>
  </g>
  <g>
    <rect x="842" y="72" width="140" height="24" class="btn" rx="2"/>
    <rect x="843" y="73" width="46" height="22" class="on"/>
    <text x="866" y="88" class="txt" font-size="10" text-anchor="middle">White</text>
    <text x="912" y="88" class="dim" font-size="10" text-anchor="middle">Pink</text>
    <text x="958" y="88" class="dim" font-size="10" text-anchor="middle">Brown</text>
  </g>
  <text x="994" y="88" class="muted" font-size="10">Lvl</text>
  <rect x="1018" y="82" width="110" height="4" class="surf" rx="2"/>
  <circle cx="1022" cy="84" r="5" fill="#e91e63"/>
  <text x="1140" y="88" class="on" font-size="10" text-anchor="end">0.00</text>

  <!-- card content: the library list, centred -->
  <text x="600" y="150" class="osc" font-size="11" text-anchor="middle" opacity="0.8">PROMPT ORCHESTRA - curated instruments; the coding agent will use these or invent its own code</text>
  <text x="345"  y="178" class="osc" font-size="13">electric piano</text>
  <text x="500"  y="178" class="osc" font-size="13">singing bowl</text>
  <text x="645"  y="178" class="osc" font-size="13">analog osc</text>
  <text x="775"  y="178" class="osc" font-size="13">transistor organ/string machine</text>

  <!-- ══════════════ B: after authoring ══════════════ -->
  <text x="30" y="288" class="muted" font-size="13" font-weight="600">B — sobald der Autor ein Instrument geschrieben hat: dessen Parameter, spaltenweise je Teilinstrument</text>

  <rect x="30" y="300" width="1140" height="290" class="card" rx="3"/>
  <rect x="30" y="300" width="1140" height="22" class="hdr" rx="3"/>
  <text x="42" y="316" class="txt" font-size="12" font-weight="700" letter-spacing="0.6">ENGINE</text>

  <!-- identical top bar, unchanged -->
  <rect x="42" y="332" width="150" height="24" class="slot" rx="2"/>
  <g>
    <rect x="204" y="332" width="200" height="24" class="btn" rx="2"/>
    <rect x="288" y="333" width="28" height="22" class="on"/>
    <text x="217" y="348" class="dim" font-size="10">Mono</text>
    <text x="253" y="348" class="dim" font-size="10">4</text>
    <text x="273" y="348" class="dim" font-size="10">8</text>
    <text x="299" y="348" class="txt" font-size="10">16</text>
    <text x="330" y="348" class="dim" font-size="10">32</text>
    <text x="368" y="348" class="dim" font-size="10">64</text>
  </g>
  <rect x="418" y="332" width="70" height="24" class="btn" rx="2"/>
  <text x="453" y="348" class="dim" font-size="10" text-anchor="middle">12–TET</text>
  <g>
    <rect x="700" y="332" width="130" height="24" class="btn" rx="2"/>
    <rect x="751" y="333" width="26" height="22" class="on"/>
    <text x="711" y="348" class="dim" font-size="10">−2</text>
    <text x="737" y="348" class="dim" font-size="10">−1</text>
    <text x="761" y="348" class="txt" font-size="10">0</text>
    <text x="785" y="348" class="dim" font-size="10">+1</text>
    <text x="810" y="348" class="dim" font-size="10">+2</text>
  </g>
  <g>
    <rect x="842" y="332" width="140" height="24" class="btn" rx="2"/>
    <rect x="843" y="333" width="46" height="22" class="on"/>
    <text x="866" y="348" class="txt" font-size="10" text-anchor="middle">White</text>
    <text x="912" y="348" class="dim" font-size="10" text-anchor="middle">Pink</text>
    <text x="958" y="348" class="dim" font-size="10" text-anchor="middle">Brown</text>
  </g>
  <text x="994" y="348" class="muted" font-size="10">Lvl</text>
  <rect x="1018" y="342" width="110" height="4" class="surf" rx="2"/>
  <circle cx="1022" cy="344" r="5" fill="#e91e63"/>
  <text x="1140" y="348" class="on" font-size="10" text-anchor="end">0.00</text>

  <!-- caption: the author's own READING -->
  <text x="600" y="382" class="osc" font-size="11" text-anchor="middle" opacity="0.8">PROMPT ORCHESTRA - bowed steel bar under a breathing bottle</text>

  <!-- three columns -->
  <line x1="410" y1="396" x2="410" y2="572" class="rule"/>
  <line x1="790" y1="396" x2="790" y2="572" class="rule"/>

  <!-- column 1 -->
  <text x="52" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">BOWED STEEL BAR</text>
  <g>
    <text x="52"  y="440" class="dim" font-size="11">Bow pressure</text>
    <rect x="170" y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="435" width="67"  height="5" class="on" rx="2"/>
    <circle cx="237" cy="437.5" r="6" fill="#e91e63"/>
    <text x="348" y="440" class="on" font-size="10">0.42</text>
  </g>
  <g>
    <text x="52"  y="472" class="dim" font-size="11">Bow position</text>
    <rect x="170" y="467" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="467" width="118" height="5" class="on" rx="2"/>
    <circle cx="288" cy="469.5" r="6" fill="#e91e63"/>
    <text x="348" y="472" class="on" font-size="10">0.74</text>
  </g>
  <g>
    <text x="52"  y="504" class="dim" font-size="11">Metal</text>
    <rect x="170" y="499" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="499" width="40"  height="5" class="on" rx="2"/>
    <circle cx="210" cy="501.5" r="6" fill="#e91e63"/>
    <text x="348" y="504" class="on" font-size="10">0.25</text>
  </g>

  <!-- column 2 -->
  <text x="432" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">BREATHING BOTTLE</text>
  <g>
    <text x="432" y="440" class="dim" font-size="11">Breath</text>
    <rect x="550" y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="435" width="93"  height="5" class="on" rx="2"/>
    <circle cx="643" cy="437.5" r="6" fill="#e91e63"/>
    <text x="728" y="440" class="on" font-size="10">0.58</text>
  </g>
  <g>
    <text x="432" y="472" class="dim" font-size="11">Bottle size</text>
    <rect x="550" y="467" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="467" width="53"  height="5" class="on" rx="2"/>
    <circle cx="603" cy="469.5" r="6" fill="#e91e63"/>
    <text x="728" y="472" class="on" font-size="10">0.33</text>
  </g>
  <g>
    <text x="432" y="504" class="dim" font-size="11">Wobble</text>
    <rect x="550" y="499" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="499" width="16"  height="5" class="on" rx="2"/>
    <circle cx="566" cy="501.5" r="6" fill="#e91e63"/>
    <text x="728" y="504" class="on" font-size="10">0.10</text>
  </g>

  <!-- column 3 -->
  <text x="812" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">AIR</text>
  <g>
    <text x="812"  y="440" class="dim" font-size="11">Amount</text>
    <rect x="930"  y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="930"  y="435" width="29"  height="5" class="on" rx="2"/>
    <circle cx="959" cy="437.5" r="6" fill="#e91e63"/>
    <text x="1108" y="440" class="on" font-size="10">0.18</text>
  </g>
  <g>
    <text x="812"  y="472" class="dim" font-size="11">Colour</text>
    <rect x="930"  y="467" width="160" height="5" class="surf" rx="2"/>
    <rect x="930"  y="467" width="106" height="5" class="on" rx="2"/>
    <circle cx="1036" cy="469.5" r="6" fill="#e91e63"/>
    <text x="1108" y="472" class="on" font-size="10">0.66</text>
  </g>
  <text x="812" y="504" class="note" font-size="10" font-style="italic">— dritte Zeile: der Autor hat hier keine erklärt —</text>

  <text x="600" y="556" class="note" font-size="10" text-anchor="middle">3 Spalten = die drei Layer, die die Plattform ohnehin kennt (kvol1..3 / koct1..3). 3 Zeilen als Regel, 4 als harte Grenze.</text>
  <text x="600" y="574" class="note" font-size="10" text-anchor="middle">Jede Zeile ist dieselbe SliderRow wie überall sonst im Synth — Name links, Bahn, Wert rechts, Rechtsklick = MIDI-Learn.</text>

  <!-- ══════════════ C: the wire ══════════════ -->
  <text x="30" y="638" class="muted" font-size="13" font-weight="600">C — woher die Regler kommen: der Autor erklärt sie, nichts wird geraten</text>

  <rect x="30" y="650" width="560" height="330" class="callout" rx="3"/>
  <text x="46" y="674" class="muted" font-size="10" letter-spacing="0.5">WAS DER AUTOR IN DEN FENCE SCHREIBT</text>
  <g class="code" font-size="11">
    <text x="46" y="700" class="dim">```csound</text>
    <text x="46" y="718" class="note">kbow    = 0.10 + 3.90 * <tspan class="osc">kp1a</tspan>      ; bow force</text>
    <text x="46" y="736" class="note">kpos    = 0.02 + 0.70 * <tspan class="osc">kp1b</tspan></text>
    <text x="46" y="754" class="note">a1      wgbow 0.5, kfreq*koct1, kbow, kpos, ...</text>
    <text x="46" y="772" class="note">...</text>
    <text x="46" y="796" class="txt">READING: bowed steel bar under a breathing bottle</text>
    <text x="46" y="818" class="txt">LAYER: 1 "Bowed steel bar"</text>
    <text x="46" y="836" class="txt">PARAM: 1a "Bow pressure" = 0.42 ; thin .. overdriven</text>
    <text x="46" y="854" class="txt">PARAM: 1b "Bow position" = 0.74 ; near bridge .. over</text>
    <text x="46" y="872" class="txt">PARAM: 1c "Metal" = 0.25 ; wood .. steel</text>
    <text x="46" y="890" class="txt">LAYER: 2 "Breathing bottle"</text>
    <text x="46" y="908" class="txt">PARAM: 2a "Breath" = 0.58 ; ...</text>
    <text x="46" y="930" class="dim">```</text>
  </g>
  <text x="46" y="958" class="note" font-size="10">Ein PARAM ohne sein `kp..` im Körper wird verworfen — ein Regler, der nichts</text>
  <text x="46" y="972" class="note" font-size="10">bewegt, ist genau die Halluzination, die hier nicht vorkommen darf.</text>

  <rect x="610" y="650" width="560" height="330" class="callout" rx="3"/>
  <text x="626" y="674" class="muted" font-size="10" letter-spacing="0.5">WAS DER HOST DAFÜR BEREITSTELLT</text>
  <g class="code" font-size="11">
    <text x="626" y="700" class="note">; im Kopf der Orchestra, wie osc1vol/osc1oct heute schon:</text>
    <text x="626" y="720" class="txt">chnset 0.4200, "lroP1a"</text>
    <text x="626" y="738" class="txt">chnset 0.7400, "lroP1b"      ; Vorgabe = was der Autor</text>
    <text x="626" y="756" class="txt">chnset 0.2500, "lroP1c"      ;   geschrieben hat</text>
    <text x="626" y="782" class="note">; in instr 1, neben kvol1/koct1:</text>
    <text x="626" y="802" class="txt">kp1a   chnget "lroP1a"</text>
    <text x="626" y="820" class="txt">kp1b   chnget "lroP1b"</text>
    <text x="626" y="838" class="txt">...                          ; 3 Layer x 4 = 12 Kanäle</text>
  </g>
  <text x="626" y="878" class="dim" font-size="10.5">Der Regler schreibt den Kanal — kein Neu-Kompilieren, kein Neu-Schreiben.</text>
  <text x="626" y="896" class="dim" font-size="10.5">Wertebereich ist immer 0..1: EIN Slider-Typ, keine erfundene Einheit;</text>
  <text x="626" y="914" class="dim" font-size="10.5">die Abbildung auf Hz, Q, Index steht im Code des Autors.</text>
  <text x="626" y="940" class="dim" font-size="10.5">12 feste APVTS-Parameter tragen die Werte — damit sind sie</text>
  <text x="626" y="958" class="dim" font-size="10.5">automatisierbar und stehen im Preset; die BESCHRIFTUNG kommt</text>
  <text x="626" y="976" class="dim" font-size="10.5">aus den PARAM-Zeilen, die neben dem Orchestra-Text gespeichert werden.</text>
</svg>
