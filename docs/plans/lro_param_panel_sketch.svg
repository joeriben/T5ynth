<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <style>
      .bg     { fill: #0e1018; }
      .card   { fill: #1a1e2a; stroke: #353a4a; }
      .surf   { fill: #1e2130; }
      .btn    { fill: #1e2130; stroke: #353a4a; }
      .on     { fill: #e91e63; }
      .txt    { fill: #e7edf5; }
      .dim    { fill: #c2cad7; }
      .muted  { fill: #9aa6b8; }
      .osc    { fill: #667eea; }
      .hdr    { fill: #b5225a; }
      .slot   { fill: none; stroke: #353a4a; stroke-dasharray: 4 3; }
      .note   { fill: #768294; }
      .rule   { stroke: #353a4a; }
      .callout{ fill: #141722; stroke: #353a4a; }
      .code   { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="1010" class="bg"/>

  <!-- ══════════════ A: no orchestra yet ══════════════ -->
  <text x="30" y="28" class="muted" font-size="13" font-weight="600">A — bevor der Autor geschrieben hat (Zustand von heute, unverändert)</text>

  <rect x="30" y="40" width="1140" height="200" class="card" rx="3"/>
  <rect x="30" y="40" width="1140" height="22" class="hdr" rx="3"/>
  <text x="42" y="56" class="txt" font-size="12" font-weight="700" letter-spacing="0.6">ENGINE</text>

  <!-- top bar -->
  <rect x="42" y="72" width="150" height="24" class="slot" rx="2"/>
  <text x="117" y="88" class="note" font-size="9" text-anchor="middle">(Platz der Engine-Schalter)</text>

  <g>
    <rect x="204" y="72" width="200" height="24" class="btn" rx="2"/>
    <rect x="288" y="73" width="28" height="22" class="on"/>
    <text x="217" y="88" class="dim" font-size="10">Mono</text>
    <text x="253" y="88" class="dim" font-size="10">4</text>
    <text x="273" y="88" class="dim" font-size="10">8</text>
    <text x="299" y="88" class="txt" font-size="10">16</text>
    <text x="330" y="88" class="dim" font-size="10">32</text>
    <text x="368" y="88" class="dim" font-size="10">64</text>
  </g>
  <rect x="418" y="72" width="70" height="24" class="btn" rx="2"/>
  <text x="453" y="88" class="dim" font-size="10" text-anchor="middle">12–TET</text>

  <g>
    <rect x="700" y="72" width="130" height="24" class="btn" rx="2"/>
    <rect x="751" y="73" width="26" height="22" class="on"/>
    <text x="711" y="88" class="dim" font-size="10">−2</text>
    <text x="737" y="88" class="dim" font-size="10">−1</text>
    <text x="761" y="88" class="txt" font-size="10">0</text>
    <text x="785" y="88" class="dim" font-size="10">+1</text>
    <text x="810" y="88" class="dim" font-size="10">+2</text>
  </g>
  <g>
    <rect x="842" y="72" width="140" height="24" class="btn" rx="2"/>
    <rect x="843" y="73" width="46" height="22" class="on"/>
    <text x="866" y="88" class="txt" font-size="10" text-anchor="middle">White</text>
    <text x="912" y="88" class="dim" font-size="10" text-anchor="middle">Pink</text>
    <text x="958" y="88" class="dim" font-size="10" text-anchor="middle">Brown</text>
  </g>
  <text x="994" y="88" class="muted" font-size="10">Lvl</text>
  <rect x="1018" y="82" width="110" height="4" class="surf" rx="2"/>
  <circle cx="1022" cy="84" r="5" fill="#e91e63"/>
  <text x="1140" y="88" class="on" font-size="10" text-anchor="end">0.00</text>

  <!-- card content: the library list, centred -->
  <text x="600" y="150" class="osc" font-size="11" text-anchor="middle" opacity="0.8">PROMPT ORCHESTRA - curated instruments; the coding agent will use these or invent its own code</text>
  <text x="345"  y="178" class="osc" font-size="13">electric piano</text>
  <text x="500"  y="178" class="osc" font-size="13">singing bowl</text>
  <text x="645"  y="178" class="osc" font-size="13">analog osc</text>
  <text x="775"  y="178" class="osc" font-size="13">transistor organ/string machine</text>

  <!-- ══════════════ B: after authoring ══════════════ -->
  <text x="30" y="288" class="muted" font-size="13" font-weight="600">B — sobald der Autor ein Instrument geschrieben hat: dessen Parameter, spaltenweise je Teilinstrument</text>

  <rect x="30" y="300" width="1140" height="290" class="card" rx="3"/>
  <rect x="30" y="300" width="1140" height="22" class="hdr" rx="3"/>
  <text x="42" y="316" class="txt" font-size="12" font-weight="700" letter-spacing="0.6">ENGINE</text>

  <!-- identical top bar, unchanged -->
  <rect x="42" y="332" width="150" height="24" class="slot" rx="2"/>
  <g>
    <rect x="204" y="332" width="200" height="24" class="btn" rx="2"/>
    <rect x="288" y="333" width="28" height="22" class="on"/>
    <text x="217" y="348" class="dim" font-size="10">Mono</text>
    <text x="253" y="348" class="dim" font-size="10">4</text>
    <text x="273" y="348" class="dim" font-size="10">8</text>
    <text x="299" y="348" class="txt" font-size="10">16</text>
    <text x="330" y="348" class="dim" font-size="10">32</text>
    <text x="368" y="348" class="dim" font-size="10">64</text>
  </g>
  <rect x="418" y="332" width="70" height="24" class="btn" rx="2"/>
  <text x="453" y="348" class="dim" font-size="10" text-anchor="middle">12–TET</text>
  <g>
    <rect x="700" y="332" width="130" height="24" class="btn" rx="2"/>
    <rect x="751" y="333" width="26" height="22" class="on"/>
    <text x="711" y="348" class="dim" font-size="10">−2</text>
    <text x="737" y="348" class="dim" font-size="10">−1</text>
    <text x="761" y="348" class="txt" font-size="10">0</text>
    <text x="785" y="348" class="dim" font-size="10">+1</text>
    <text x="810" y="348" class="dim" font-size="10">+2</text>
  </g>
  <g>
    <rect x="842" y="332" width="140" height="24" class="btn" rx="2"/>
    <rect x="843" y="333" width="46" height="22" class="on"/>
    <text x="866" y="348" class="txt" font-size="10" text-anchor="middle">White</text>
    <text x="912" y="348" class="dim" font-size="10" text-anchor="middle">Pink</text>
    <text x="958" y="348" class="dim" font-size="10" text-anchor="middle">Brown</text>
  </g>
  <text x="994" y="348" class="muted" font-size="10">Lvl</text>
  <rect x="1018" y="342" width="110" height="4" class="surf" rx="2"/>
  <circle cx="1022" cy="344" r="5" fill="#e91e63"/>
  <text x="1140" y="348" class="on" font-size="10" text-anchor="end">0.00</text>

  <!-- caption: the author's own READING -->
  <text x="600" y="382" class="osc" font-size="11" text-anchor="middle" opacity="0.8">PROMPT ORCHESTRA - a struck singing bowl under a detuned analog lead</text>

  <!-- three columns -->
  <line x1="410" y1="396" x2="410" y2="572" class="rule"/>
  <line x1="790" y1="396" x2="790" y2="572" class="rule"/>

  <!-- column 1 -->
  <text x="52" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">SINGING BOWL</text>
  <g>
    <text x="52" y="440" class="dim" font-size="11">Bowl</text>
    <rect x="170" y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="435" width="80" height="5" class="on" rx="2"/>
    <circle cx="250" cy="437.5" r="6" fill="#e91e63"/>
    <text x="348" y="440" class="on" font-size="10">0.50</text>
  </g>
  <g>
    <text x="52" y="468" class="dim" font-size="11">Warble</text>
    <rect x="170" y="463" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="463" width="48" height="5" class="on" rx="2"/>
    <circle cx="218" cy="465.5" r="6" fill="#e91e63"/>
    <text x="348" y="468" class="on" font-size="10">0.30</text>
  </g>
  <g>
    <text x="52" y="496" class="dim" font-size="11">Ring</text>
    <rect x="170" y="491" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="491" width="96" height="5" class="on" rx="2"/>
    <circle cx="266" cy="493.5" r="6" fill="#e91e63"/>
    <text x="348" y="496" class="on" font-size="10">0.60</text>
  </g>
  <g>
    <text x="52" y="524" class="dim" font-size="11">Sung</text>
    <rect x="170" y="519" width="160" height="5" class="surf" rx="2"/>
    <rect x="170" y="519" width="0" height="5" class="on" rx="2"/>
    <circle cx="170" cy="521.5" r="6" fill="#e91e63"/>
    <text x="348" y="524" class="on" font-size="10">0.00</text>
  </g>

  <!-- column 2 -->
  <text x="432" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">ANALOG OSC</text>
  <g>
    <text x="432" y="440" class="dim" font-size="11">Wave</text>
    <rect x="550" y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="435" width="0" height="5" class="on" rx="2"/>
    <circle cx="550" cy="437.5" r="6" fill="#e91e63"/>
    <text x="728" y="440" class="on" font-size="10">0.00</text>
  </g>
  <g>
    <text x="432" y="468" class="dim" font-size="11">Width</text>
    <rect x="550" y="463" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="463" width="0" height="5" class="on" rx="2"/>
    <circle cx="550" cy="465.5" r="6" fill="#e91e63"/>
    <text x="728" y="468" class="on" font-size="10">0.00</text>
  </g>
  <g>
    <text x="432" y="496" class="dim" font-size="11">Drive</text>
    <rect x="550" y="491" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="491" width="56" height="5" class="on" rx="2"/>
    <circle cx="606" cy="493.5" r="6" fill="#e91e63"/>
    <text x="728" y="496" class="on" font-size="10">0.35</text>
  </g>
  <g>
    <text x="432" y="524" class="dim" font-size="11">Age</text>
    <rect x="550" y="519" width="160" height="5" class="surf" rx="2"/>
    <rect x="550" y="519" width="56" height="5" class="on" rx="2"/>
    <circle cx="606" cy="521.5" r="6" fill="#e91e63"/>
    <text x="728" y="524" class="on" font-size="10">0.35</text>
  </g>

  <!-- column 3 -->
  <text x="812" y="410" class="osc" font-size="11" font-weight="700" letter-spacing="0.5">SUPERSAW</text>
  <g>
    <text x="812" y="440" class="dim" font-size="11">Detune</text>
    <rect x="930" y="435" width="160" height="5" class="surf" rx="2"/>
    <rect x="930" y="435" width="80" height="5" class="on" rx="2"/>
    <circle cx="1010" cy="437.5" r="6" fill="#e91e63"/>
    <text x="1108" y="440" class="on" font-size="10">0.50</text>
  </g>
  <g>
    <text x="812" y="468" class="dim" font-size="11">Mix</text>
    <rect x="930" y="463" width="160" height="5" class="surf" rx="2"/>
    <rect x="930" y="463" width="120" height="5" class="on" rx="2"/>
    <circle cx="1050" cy="465.5" r="6" fill="#e91e63"/>
    <text x="1108" y="468" class="on" font-size="10">0.75</text>
  </g>
  <text x="812" y="500" class="note" font-size="10" font-style="italic">&#8212; supersaw hat nur zwei Achsen &#8212;</text>

  <text x="600" y="556" class="note" font-size="10" text-anchor="middle">Eine Spalte = ein Bibliothekseintrag, unter seinem Bibliotheksnamen, in der Reihenfolge der Zeilen im Körper. 3 Spalten, 4 Plätze.</text>
  <text x="600" y="574" class="note" font-size="10" text-anchor="middle">Jede Zeile ist dieselbe SliderRow wie überall sonst im Synth — Name links, Bahn, Wert rechts, Rechtsklick = MIDI-Learn. Der Name ist der der Bibliothek.</text>

  <!-- ══════════════ C: the wire ══════════════ -->
  <text x="30" y="638" class="muted" font-size="13" font-weight="600">C — woher die Regler kommen: aus der Bibliothek, verdrahtet vom Host</text>

  <rect x="30" y="650" width="560" height="330" class="callout" rx="3"/>
  <text x="46" y="674" class="muted" font-size="10" letter-spacing="0.5">WAS DER AUTOR IN DEN FENCE SCHREIBT</text>
  <g class="code" font-size="11">
    <text x="46" y="700" class="dim">```csound</text>
    <text x="46" y="722" class="txt">kbowl   = 0.50   <tspan class="osc">; bowl[0.0..1.0]:</tspan> which measured bowl</text>
    <text x="46" y="740" class="txt">kwarb   = 0.30   <tspan class="osc">; warble[0.0..1.0]:</tspan> the mode pairs apart</text>
    <text x="46" y="758" class="txt">kring   = 0.60   <tspan class="osc">; ring[0.0..1.0]:</tspan> how long the shell holds</text>
    <text x="46" y="782" class="note">kr3     = 2.70 + 0.20 * kbowl</text>
    <text x="46" y="800" class="note">a3a     mode aex, kc * kr3, kq3</text>
    <text x="46" y="818" class="note">...</text>
    <text x="46" y="842" class="txt">READING: a struck singing bowl with a long dark tail</text>
    <text x="46" y="864" class="dim">```</text>
  </g>
  <text x="46" y="898" class="note" font-size="10">Die drei Zeilen stehen so in der Bibliothek. Der Autor BEHÄLT sie — und wählt</text>
  <text x="46" y="912" class="note" font-size="10">die Zahl, also die Startstellung. Er schreibt kein `kp` und deklariert nichts.</text>
  <text x="46" y="934" class="note" font-size="10">Ein Name, den die Bibliothek nicht deklariert, wird kein Regler: der Autor</text>
  <text x="46" y="948" class="note" font-size="10">kann sich keinen erfinden, und keiner kann tot sein, weil er die Verbindung</text>
  <text x="46" y="962" class="note" font-size="10">gar nicht selbst herstellt.</text>

  <rect x="610" y="650" width="560" height="330" class="callout" rx="3"/>
  <text x="626" y="674" class="muted" font-size="10" letter-spacing="0.5">WAS DER HOST DARAUS MACHT</text>
  <g class="code" font-size="11">
    <text x="626" y="700" class="note">; im Kopf der Orchestra, wie osc1vol/osc1oct heute schon:</text>
    <text x="626" y="720" class="txt">chnset 0.5000, "lroP1a"      ; Vorgabe = die Zahl,</text>
    <text x="626" y="738" class="txt">chnset 0.3000, "lroP1b"      ;   die der Autor gewählt</text>
    <text x="626" y="756" class="txt">chnset 0.6000, "lroP1c"      ;   hat, auf 0..1 gelegt</text>
    <text x="626" y="782" class="note">; in instr 1, neben kvol1/koct1:</text>
    <text x="626" y="802" class="txt">kp1a   chnget "lroP1a"       ; 3 Spalten x 4 = 12 Kanäle</text>
    <text x="626" y="826" class="note">; und die EINE Zeile im Körper wird umgeschrieben:</text>
    <text x="626" y="846" class="txt">kbowl  = 0 + 1 * <tspan class="osc">kp1a</tspan>   ; bowl[0.0..1.0]: which ...</text>
  </g>
  <text x="626" y="882" class="dim" font-size="10.5">Der Regler schreibt den Kanal — kein Neu-Kompilieren, kein Neu-Schreiben.</text>
  <text x="626" y="900" class="dim" font-size="10.5">Im UI ist er immer 0..1: EIN Slider-Typ, keine erfundene Einheit. Die</text>
  <text x="626" y="918" class="dim" font-size="10.5">Abbildung ist die Klammer AUS DER ZEILE — sie steht neben dem Code,</text>
  <text x="626" y="936" class="dim" font-size="10.5">der den Wert liest, und ist deshalb die einzige, die sicher ist.</text>
  <text x="626" y="962" class="dim" font-size="10.5">12 feste APVTS-Parameter tragen die Werte — automatisierbar und im</text>
  <text x="626" y="980" class="dim" font-size="10.5">Preset; die BESCHRIFTUNG ist der Name, den die Bibliothek vergibt.</text>
</svg>
